[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-ai"
version = "0.0.1"
description = "ИИ-контур тренажёра диспетчера ДДС: контракты, адаптеры моделей, моки соседних модулей"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
voice-fasterwhisper = ["faster-whisper>=1.0"]
voice-vosk = ["vosk>=0.3.45"]
voice-silero = ["torch>=2.2"]
voice-piper = ["piper-tts>=1.2"]
llm-llamacpp = ["llama-cpp-python>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
