name: ai

on:
  push:
    paths: ["ai/**", "contracts/**", ".github/workflows/ai.yml"]
  pull_request:
    paths: ["ai/**", "contracts/**", ".github/workflows/ai.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "ai[dev]"
      - run: ai/scripts/check.sh
